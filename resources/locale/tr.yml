toreador-flarum-job-queue:
  admin:
    nav:
      queue_manager: Kuyruk Yöneticisi
      title: Başarısız veritabanı kuyruk işlerini listele ve yeniden kuyruğa al

    settings:
      open_list_button: Başarısız iş listesini aç
      open_list_help: |
        Başarısız işler ayrı bir sayfada listelenir; böylece siz bu ayarları
        değiştirirken liste kullanılabilir kalır. Aynı sayfaya admin sol
        menüsündeki "Kuyruk Yöneticisi" bağlantısından da ulaşabilirsiniz.
      table_prefix_label: Tablo önekini elle belirt
      table_prefix_help: |
        Boş bırakılırsa önek (ör. `toreador34_`) Flarum veritabanı bağlantınızdan
        otomatik okunur. Yalnızca kuyruk tabloları Flarum'un bilmediği özel bir
        önekle oluşturulduysa burayı doldurun.
      auto_requeue_label: Başarısız işleri otomatik yeniden kuyruğa al
      auto_requeue_help: |
        Etkinleştirildiğinde planlı bir görev, başarısız işleri otomatik olarak
        kuyruğa geri taşır. İşler kuyruk çalıştırıcınız tarafından işlenir
        (ör. `flarum schedule:run` + Database Queue eklentisi).
      auto_requeue_after_label: Kaç dakika sonra yeniden kuyruğa alınsın
      auto_requeue_after_help: |
        Bu dakikadan daha uzun süredir başarısız olan işler yeniden kuyruğa
        alınır. Anında başarısız olan işlerde sonsuz döngüyü önler.
      auto_requeue_max_attempts_label: İş başına otomatik yeniden kuyruğa alma sınırı
      auto_requeue_max_attempts_help: |
        Zamanlayıcının aynı başarısız işi en fazla kaç kez otomatik olarak
        yeniden kuyruğa alacağı. Sınıra ulaşan iş, siz elle yeniden kuyruğa
        alana kadar başarısız listesinde kalır; böylece sürekli başarısız olan
        bir iş sonsuz döngüye girip spam üretemez. Sınırsız için 0 girin.
        Varsayılan: 1.

    page:
      title: Kuyruk Yöneticisi
      subtitle: Başarısız veritabanı kuyruk işlerini incele ve yeniden çalıştır.
      refresh: Yenile
      auto_refresh: Otomatik yenile
      tables_missing: |
        Kuyruk tabloları bulunamadı. Database Queue eklentisinin
        (blomstra/database-queue) etkin olduğundan ve kuyruk sürücünüzün
        `database` olarak ayarlandığından emin olun.
      auto_requeue_banner: |
        Otomatik yeniden kuyruğa alma etkin. Başarısız işler otomatik olarak
        kuyruğa geri taşınacak.
      stats:
        pending: Bekleyen
        pending_help: Şu anda kuyrukta bekleyen iş sayısı.
        failed: Başarısız
        failed_help: Başarısız iş tablosunda kayıtlı iş sayısı.
        prefix: Tablo öneki
        prefix_help: Flarum veritabanı yapılandırmanızdan okunur.
        prefix_none: yok (tablolar öneksiz)
        failed_table: Başarısız işler tablosu
        jobs_table: İşler tablosu

    filters:
      all_queues: Tüm kuyruklar
      search_placeholder: Kuyruk veya iş (payload) ara...
      requeue_all: Tümünü Yeniden Kuyruğa Al
      requeue_all_help: Her başarısız işi kuyruğa geri taşı.
      requeue_all_confirm: Tüm başarısız işler yeniden kuyruğa alınsın mı? Kuyruk çalıştırıcı tarafından tekrar işlenecekler.
      clear_all: Tümünü Temizle
      clear_all_help: Başarısız iş kayıtlarını yeniden kuyruğa almadan sil.
      clear_all_confirm: Tüm başarısız iş kayıtları kalıcı olarak silinsin mi? Bu işlem onları TEKRAR ÇALIŞTIRMAZ.

    table:
      id: Kimlik
      queue: Kuyruk
      job: İş
      exception: Hata
      failed_at: Başarısızlık Zamanı
      actions: İşlemler
      empty: Başarısız iş bulunamadı.
      requeue_title: Bu işi kuyruğa geri taşı.
      requeue_confirm: "#{id} numaralı başarısız iş yeniden kuyruğa alınsın mı? Kuyruk çalıştırıcı tekrar işleyecek."
      requeued: "#{id} numaralı iş başarıyla yeniden kuyruğa alındı."
      requeued_all: "{count} iş başarıyla yeniden kuyruğa alındı."
      details_title: Bu işin tam yükünü ve hatasını incele.
      delete_title: Bu başarısız iş kaydını sil.
      delete_confirm: "#{id} numaralı başarısız iş kalıcı olarak silinsin mi? Tekrar ÇALIŞTIRILMAZ."
      deleted: "#{id} numaralı başarısız iş silindi."
      cleared: "{count} başarısız iş kaydı silindi."
      attempts: Maks. deneme
      timeout: Zaman aşımı (sn)
      backoff: Bekleme (sn)

    pagination:
      x_of_y: "{from}–{to} / {total}"

    modal:
      title: "Başarısız İş #{id}"
      description: Bu iş ne yapar?
      payload: Yük (Payload)
      exception: Hata

  job:
    unknown: Bu işin yükü (payload) tanımlanamadı.
    closure: Bir closure (satır içi PHP kodu) çalıştırır.
    call_queued: Sıraya alınmış bir komut veya işleyici.
    mail: E-posta mesajı gönderir, ör. bildirimler, şifre sıfırlama veya özetler.
    email: E-posta mesajı gönderir.
    notification: Kullanıcılara bildirim gönderir.
    webhook: Harici bir webhook'a veri iletir.
    reindex: Arama verilerini yeniden dizinler.
    sitemap: Site haritasını yeniler.
    backup: Yedekleme görevi çalıştırır.
    import: Harici kaynaktan veri içe aktarır.
    export: Veri dışa aktarır.
    sync: Harici bir servisle veriyi eşitler.
    generic: '"{name}" adlı kuyruk işini çalıştırır.'
